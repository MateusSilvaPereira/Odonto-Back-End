spring.application.name=Odonto
# Render (e a maioria dos PaaS) define a porta via variavel de ambiente PORT
# em vez de uma porta fixa - sem o fallback, a aplicacao sobe na porta errada
# em producao e o health check nunca bate.
server.port=${PORT:8080}

# =========================
# ACTUATOR (health check)
# =========================
# So /health fica exposto (ver SecurityConfig) - suficiente para o Render
# saber se o servico subiu, sem abrir detalhes internos (env, beans, etc.).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Segredos locais (não versionados) - ex: credenciais Twilio.
# Ver .gitignore. Se o arquivo não existir, é ignorado (optional:).
spring.config.import=optional:classpath:application-secrets.properties

# =========================
# DATABASE (NEON CLOUD)
# =========================
# Credenciais NUNCA em texto puro no arquivo — vêm de variáveis de ambiente
# (ver .gitignore/application-secrets.properties para uso local, igual já é
# feito com o Twilio). Sem elas configuradas, a aplicação não sobe.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-twilight-dew-acmmltwu.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# UPLOAD DE ARQUIVOS (avatar de usuário, anexos clínicos)
# =========================
# Sem isso o Spring Boot usa o default de 1MB por arquivo, insuficiente pra
# radiografias/fotos em alta resolução (ver AnexoClinicoService).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# =========================
# SWAGGER
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# =========================
# JWT
# =========================
# Em dev, vem de application-secrets.properties (igual Twilio/DB), nunca
# versionado em texto puro. Em producao, definir via variavel de ambiente
# JWT_SECRET (sem valor padrao de proposito - a aplicacao nao deve subir
# com um segredo generico).
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000

# =========================
# CORS
# =========================
# Origem(ns) do frontend autorizadas a chamar a API, separadas por virgula.
# Sobrescrever em producao via APP_CORS_ALLOWED_ORIGINS com o dominio real
# (ex.: https://odonto-pro.vercel.app).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================
# E-MAIL (recuperação de senha)
# =========================
# Preencher via variáveis de ambiente. Sem SMTP_HOST configurado, o envio fica
# desativado: o link de redefinição é apenas logado (ver SmtpEmailService),
# sem quebrar a aplicação — mesmo espírito do Twilio abaixo.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from=${APP_MAIL_FROM:no-reply@odontopro.local}

# =========================
# TWILIO (lembretes de consulta por WhatsApp)
# =========================
# Preencher via variáveis de ambiente. Sem elas, o envio fica desativado
# (loga um aviso) sem quebrar a aplicação.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}

# Intervalo do job de lembretes, em milissegundos (padrão: 5 minutos)
lembretes.consulta.intervalo-ms=300000

# =========================
# LINK PÚBLICO DE CONFIRMAÇÃO DE CONSULTA
# =========================
# Base usada para montar o link enviado nos lembretes de WhatsApp
# (ex.: {frontend-url}/confirmar-consulta/{token}). Sobrescrever em produção
# via variável de ambiente com o domínio real do front-end.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}