spring.application.name=Odonto
server.port=8080

# Segredos locais (não versionados) - ex: credenciais Twilio.
# Ver .gitignore. Se o arquivo não existir, é ignorado (optional:).
spring.config.import=optional:classpath:application-secrets.properties

# =========================
# DATABASE (NEON CLOUD)
# =========================
spring.datasource.url=jdbc:postgresql://ep-twilight-dew-acmmltwu.sa-east-1.aws.neon.tech/neondb?sslmode=require

spring.datasource.username=neondb_owner
spring.datasource.password=npg_A1VoNsGemR7O
spring.datasource.driver-class-name=org.postgresql.Driver


# APENAS TESTES DE COMMIT

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# SWAGGER
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# =========================
# JWT
# =========================
jwt.secret=odonto_super_secret_key_very_secure_1234567890
jwt.expiration=3600000

# =========================
# TWILIO (lembretes de consulta por WhatsApp)
# =========================
# Preencher via variáveis de ambiente. Sem elas, o envio fica desativado
# (loga um aviso) sem quebrar a aplicação.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}

# Intervalo do job de lembretes, em milissegundos (padrão: 5 minutos)
lembretes.consulta.intervalo-ms=300000