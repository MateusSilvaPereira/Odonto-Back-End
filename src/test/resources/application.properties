# Sobrepõe application.properties nos testes: banco H2 em memória em vez do
# Postgres de produção (Neon), evitando qualquer teste tocar dados reais.
# Esse arquivo SUBSTITUI o application.properties principal (não faz merge),
# então qualquer propriedade que algum bean exija para subir precisa estar
# repetida aqui também.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-secret-key-used-only-in-automated-tests-not-for-production
jwt.expiration=3600000

# MailSenderAutoConfiguration só cria o bean JavaMailSender se a propriedade
# "spring.mail.host" existir (mesmo vazia) — sem isso, SmtpEmailService não
# sobe e o contexto completo falha em OdontoProApplicationTests.
spring.mail.host=
app.mail.from=no-reply@odontopro.local
app.frontend-url=http://localhost:5173
